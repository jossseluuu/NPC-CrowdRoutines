name: Docs and benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++
      - name: Build engine
        run: cmake --preset wsl-release && cmake --build --preset wsl-release
      - name: Generate reference pages from data/
        run: ./build-wsl/npc_crowd_routines export-docs --out docs/referencia/generado
      - name: Benchmark report (GitHub runner)
        run: |
          ./build-wsl/npc_crowd_routines benchmark --agents 2500,10000,25000 --ticks 1200 --warmup 1200 \
            --out docs/rendimiento/informes/latest.json --markdown docs/rendimiento/informes/latest.md
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: docs/rendimiento/informes
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wiki
        run: pip install mkdocs-material && mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
